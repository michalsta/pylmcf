name: Build

on:
  push:
    branches:
      - ci_wheels
  # Called by publish.yml on a v* tag. The tag no longer triggers this workflow
  # directly: it must go through publish.yml, so that the upload can depend on
  # the test suite as well as on the wheels.
  workflow_call:

concurrency:
  # Superseded wheel builds on a branch get cancelled; a release build never
  # does. A group name distinct from run-tests-* matters: publish.yml calls both
  # workflows, and a shared group would serialise them behind each other.
  group: build-wheels-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    if: github.repository_owner == 'michalsta'
    runs-on: ${{ matrix.os }}
    strategy:
      # One unbuildable platform must not cancel the other five. Every failure
      # in this workflow so far has been found one per run, because fail-fast
      # killed the rest of the matrix before it could report.
      fail-fast: false
      matrix:
        # macos-13 is an intel runner, macos-14 is apple silicon
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-15-intel, macos-latest, windows-11-arm]

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Used to host cibuildwheel
      - uses: actions/setup-python@v7

      - name: Check version
        # Only meaningful on a tag: check_version.py compares pyproject against
        # `git describe --tags --abbrev=0`, which on a branch returns the most
        # recent *reachable* tag rather than one on HEAD -- so it fails on any
        # untagged branch whose version has been bumped, taking every job that
        # needs this one down with it. That made a ci_wheels push, the only way
        # to exercise the wheel pipeline without publishing, permanently red.
        # Reusable workflows see the caller's github context, so a tag push
        # through publish.yml still runs this.
        if: startsWith(github.ref, 'refs/tags/')
        run: python .github/scripts/check_version.py

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        # to supply options, put them in 'env', like:
        env:
          GITHUB_BUILDING_WHEELS: 1
          VERBOSE: 1
          # Raised from 10.13: the nanobind-backend x86_64 wheels this extension
          # resolves at import are macosx_10_14 (cp310-cp313) and macosx_10_15
          # (cp314+). Advertising 10.13 would promise platforms where the backend
          # cannot be installed.
          MACOSX_DEPLOYMENT_TARGET: "10.15"
          # Split mode: one cp310-abi3 wheel per platform covers Python 3.10+.
          # win_arm64 is the exception -- nanobind-backend publishes no cp310
          # wheel for it, so that platform is built from cp311 (the resulting
          # wheel is still tagged cp310-abi3 and installs on 3.11+).
          # cp315t is the free-threaded lane: split mode there is abi3t-only
          # (PEP 803, 3.15+), so it cannot ride the cp310-abi3 wheel and needs a
          # build of its own. nanobind-backend publishes a cp315/abi3t wheel for
          # every platform built here, musllinux excepted below.
          CIBW_BUILD: "cp310-* cp311-win_arm64 cp315t-*"
          # cp315t needs this because 3.15 is still a prerelease. It does NOT
          # need a free-threading group: current cibuildwheel builds free-threaded
          # identifiers by default and rejects "cpython-freethreading" outright
          # (valid groups: cpython-prerelease, graalpy, pypy, pypy-eol,
          # pyodide-eol, pyodide-prerelease). This does not widen the build on its
          # own -- CIBW_BUILD still decides what is built.
          CIBW_ENABLE: "cpython-prerelease"
          # No musllinux: there are no musllinux backend wheels, because
          # auditwheel bundles a private libstdc++ and split mode needs the C++
          # runtime shared for exceptions to propagate -- and no backend sdist
          # either, so split mode is unreachable there by any route. Alpine
          # installs from sdist, where the musl branch in CMakeLists.txt falls
          # back to a linked build; test_sdist_musl below is the guard on it.
          #
          # No win32 either, and this one already got away from us: the backend
          # publishes win_amd64 and win_arm64 and nothing 32-bit, at any Python
          # version, so a split-mode win32 wheel builds cleanly and is then
          # uninstallable on its own platform -- it declares a distribution that
          # does not exist there. pylmcf 1.2.0 shipped such a wheel; it is still
          # on PyPI, and pip pulling it into a build environment is what broke
          # wnet's windows-latest wheel job. 32-bit Windows installs from sdist,
          # where the win32 branch in CMakeLists.txt falls back to linked.
          #
          # No cp310-win_arm64: CIBW_BUILD lists cp311-win_arm64 precisely
          # because that platform has to be built from 3.11, but cp310-* matches
          # it too and nothing was excluding it -- the skip that used to do so
          # was dropped in the split-mode migration. The 3.10 ARM64 leg has no
          # numpy wheel to install, so it tries to compile numpy from source and
          # dies in arraytypes.c: "Did not find correct pointer sized integer".
          CIBW_SKIP: "*-musllinux_* *-win32 cp310-win_arm64"

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    if: github.repository_owner == 'michalsta'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check version
        # Only meaningful on a tag: check_version.py compares pyproject against
        # `git describe --tags --abbrev=0`, which on a branch returns the most
        # recent *reachable* tag rather than one on HEAD -- so it fails on any
        # untagged branch whose version has been bumped, taking every job that
        # needs this one down with it. That made a ci_wheels push, the only way
        # to exercise the wheel pipeline without publishing, permanently red.
        # Reusable workflows see the caller's github context, so a tag push
        # through publish.yml still runs this.
        if: startsWith(github.ref, 'refs/tags/')
        run: python .github/scripts/check_version.py

      - name: Build sdist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  # One cp310-abi3 wheel is supposed to cover every CPython from 3.10 up, which
  # includes Pythons that did not exist when it was built. Nothing else checks
  # that: the test matrix builds from source, and cibuildwheel builds on 3.10
  # only. So install the *built artifact* on the newest interpreter there is and
  # run the suite against it. 3.15 is a prerelease; when it goes GA this job
  # keeps working unchanged, and the version should be bumped to the next one.
  test_wheel_newest:
    name: Test the abi3 wheel on Python 3.15
    if: github.repository_owner == 'michalsta'
    needs: [build_wheels]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v5
        with:
          pattern: cibw-wheels-ubuntu-latest-*
          path: dist
          merge-multiple: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          allow-prereleases: true

      - name: Check the artifact is the abi3 wheel
        run: |
          ls -l dist
          ls dist | grep -q 'cp310-abi3' || { echo "no cp310-abi3 wheel built"; exit 1; }

      - name: Install the wheel (no build -- must install as-is)
        run: |
          python -VV
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: dist/*cp310-abi3*.whl

      - name: Smoke-test the prebuilt extension
        run: |
          cd "$(mktemp -d)"
          python -c "import pylmcf; from pylmcf.pylmcf_cpp import CGraph; print('pylmcf OK', CGraph)"
          python -c "import pylmcf; assert pylmcf.is_nanobind_split(), 'a published wheel must be a split build'"

      - name: Run the test suite
        run: |
          python -m pip install pytest networkx
          python -m pytest tests/ -q

  # The abi3t wheel is the only artifact whose whole point is that the GIL stays
  # off. Installing it and running the suite is not enough to show that: every
  # test passes just as well with the GIL silently re-enabled, which is exactly
  # what happens if the FREE_THREADED option is ever dropped. tests/ has a
  # dedicated module that refuses to be fooled, but it self-skips when the GIL
  # is on, so assert here that it actually ran.
  test_wheel_freethreaded:
    name: Test the abi3t wheel on Python 3.15t
    if: github.repository_owner == 'michalsta'
    needs: [build_wheels]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v5
        with:
          pattern: cibw-wheels-ubuntu-latest-*
          path: dist
          merge-multiple: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          allow-prereleases: true
          freethreaded: true

      - name: Check an abi3t wheel was built
        run: |
          ls -l dist
          ls dist | grep -q 'abi3t' || { echo "no abi3t wheel built"; exit 1; }

      - name: Install the wheel (no build -- must install as-is)
        run: |
          python -VV
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: dist/*abi3t*.whl

      - name: The GIL must still be off once the extension is imported
        run: |
          cd "$(mktemp -d)"
          python -c "import pylmcf, sys; from pylmcf.pylmcf_cpp import CGraph; assert not sys._is_gil_enabled(), 'importing pylmcf re-enabled the GIL'; print('GIL off, pylmcf OK', CGraph)"

      - name: Run the test suite, and prove the free-threading tests ran
        run: |
          python -m pip install pytest networkx
          python -m pytest tests/ -q
          python -m pytest tests/test_free_threading.py -q --no-header -rN \
            | tee /tmp/ft.log
          grep -qE '[0-9]+ passed' /tmp/ft.log || { echo "free-threading tests did not run"; exit 1; }
          grep -q 'skipped' /tmp/ft.log && { echo "free-threading tests skipped -- GIL was on"; exit 1; }
          echo "free-threading tests ran with the GIL off"

  # musl gets no wheel (CIBW_SKIP above), and nanobind-backend publishes neither
  # a musllinux wheel nor an sdist, so Alpine has exactly one install path: build
  # from the sdist in linked mode. Until this job existed nothing tested musl at
  # all, and the fallback the comment above promised did not exist -- CMakeLists
  # had no musl branch and chose split mode, so the install failed to resolve
  # nanobind-backend, and forcing past that only bought an import-time error
  # about the missing backend module.
  #
  # There is no Alpine runner image, so this runs the whole job in an Alpine
  # container on a Ubuntu host. The JS actions below work there because the
  # runner ships musl builds of Node (node20_alpine / node24_alpine) and selects
  # them off Container.IsAlpine -- but only for linux-x64, so this job must stay
  # on an x64 runner.
  test_sdist_musl:
    name: Build from sdist on Alpine (musl)
    if: github.repository_owner == 'michalsta'
    needs: [build_sdist]
    runs-on: ubuntu-latest
    container: alpine:3.21
    defaults:
      run:
        # Alpine has no bash, and the runner would otherwise default to it.
        shell: sh
    steps:
      # Must precede the checkout: actions/checkout needs git in the container,
      # and a bare Alpine has none. No fetch-depth: 0 here -- nothing in this
      # job reads tags, and a shallow checkout is all tests/ needs.
      - name: Alpine prerequisites
        run: apk add --no-cache git python3 python3-dev py3-pip build-base cmake ninja

      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: cibw-sdist
          path: dist

      - name: Install from sdist (compiles the extension in linked mode)
        run: |
          python3 -m venv /venv
          /venv/bin/python -VV
          /venv/bin/python -m pip install --upgrade pip
          /venv/bin/python -m pip install -v dist/*.tar.gz

      - name: Assert musl was detected and the backend was not required
        # If _pylmcf_metadata.is_musl() had missed, the install above would
        # already have failed to resolve nanobind-backend -- there is no
        # musllinux wheel and no sdist for it. This pins down why.
        run: |
          /venv/bin/python -c 'import sysconfig; soabi = sysconfig.get_config_var("SOABI") or ""; assert "musl" in soabi, soabi; print("SOABI:", soabi)'
          /venv/bin/python -c 'import importlib.metadata as md; deps = md.metadata("pylmcf").get_all("Requires-Dist"); print("Requires-Dist:", deps); assert not any("nanobind-backend" in d for d in deps), deps'
          /venv/bin/python -c 'import importlib.util as iu; assert iu.find_spec("nanobind_backend") is None, "backend unexpectedly installed"'

      - name: Smoke-test the compiled extension
        # Run from a scratch directory so the import resolves to the installed
        # package rather than the source tree next to it.
        run: |
          cd "$(mktemp -d)"
          /venv/bin/python -c 'import pylmcf; from pylmcf.pylmcf_cpp import CGraph; print("pylmcf OK", CGraph)'
          /venv/bin/python -c 'import pylmcf; assert not pylmcf.is_nanobind_split(), "musl must fall back to a linked build"'

      - name: Run the test suite
        run: |
          /venv/bin/python -m pip install pytest networkx
          /venv/bin/python -m pytest tests/ -q

  # Free-threaded CPython before 3.15 predates nanobind-backend's abi3t wheels,
  # so it gets no wheel from cibuildwheel and no backend requirement from
  # _pylmcf_metadata.py -- it must build from the sdist in linked mode with
  # nothing but numpy. This job is the guard on that: declaring the backend
  # statically used to make the resolve fail here before a compiler was reached,
  # and nothing else in CI installs on a free-threaded interpreter.
  test_sdist_freethreaded:
    name: Build from sdist on free-threaded CPython
    if: github.repository_owner == 'michalsta'
    needs: [build_sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v5
        with:
          name: cibw-sdist
          path: dist

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14t"

      - name: Install from sdist (compiles the extension in linked mode)
        run: |
          python -VV
          python -m pip install --upgrade pip
          python -m pip install -v dist/*.tar.gz

      - name: Assert the backend was not required
        # A linked build embeds nanobind; pulling nanobind-backend in here would
        # mean _pylmcf_metadata.py had mis-detected the interpreter.
        run: |
          python -c "import importlib.metadata as m; d = m.metadata('pylmcf').get_all('Requires-Dist'); print(d); assert not any('nanobind-backend' in r for r in d), d"
          python -c "import importlib.util as u; assert u.find_spec('nanobind_backend') is None, 'backend unexpectedly installed'"

      - name: Smoke-test the compiled extension
        run: |
          cd "$(mktemp -d)"
          python -c "import pylmcf; from pylmcf.pylmcf_cpp import CGraph; print('pylmcf OK', CGraph)"
          python -c "import pylmcf; assert not pylmcf.is_nanobind_split(), 'this lane must fall back to a linked build'"

      - name: Run the test suite
        run: |
          python -m pip install pytest networkx
          python -m pytest tests/ -q

  # Split mode is CPython-only, so PyPy gets no wheel. It must still be able to
  # build pylmcf from the sdist, which is the only path that exercises the
  # NB_STATIC fallback in CMakeLists.txt. Without this job that fallback would
  # rot unnoticed until somebody on PyPy or Alpine tried to install.
  test_sdist_pypy:
    name: Build from sdist on PyPy
    if: github.repository_owner == 'michalsta'
    needs: [build_sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v5
        with:
          name: cibw-sdist
          path: dist

      - uses: actions/setup-python@v7
        with:
          python-version: "pypy3.11"

      - name: Install from sdist (compiles the extension in linked mode)
        run: |
          python -VV
          python -m pip install --upgrade pip
          python -m pip install -v dist/*.tar.gz

      - name: Smoke-test the compiled extension
        # Run from a scratch directory so the import resolves to the installed
        # package rather than the source tree next to it.
        run: |
          cd "$(mktemp -d)"
          python -c "import pylmcf; from pylmcf.pylmcf_cpp import CGraph; print('pylmcf OK', CGraph)"
          python -c "import pylmcf; assert not pylmcf.is_nanobind_split(), 'this lane must fall back to a linked build'"

      - name: Run the test suite
        run: |
          python -m pip install pytest networkx
          python -m pytest tests/ -q
