name: Build

on:
  push:
    branches:
      - ci_wheels
  workflow_call:

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    if: github.repository_owner == 'michalsta'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # macos-13 is an intel runner, macos-14 is apple silicon
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-15-intel, macos-latest, windows-11-arm]

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Used to host cibuildwheel
      - uses: actions/setup-python@v5

      - name: Check version
        run: python .github/scripts/check_version.py

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        # to supply options, put them in 'env', like:
        env:
          GITHUB_BUILDING_WHEELS: 1
          VERBOSE: 1
          # Raised from 10.13: the nanobind-backend x86_64 wheels this extension
          # resolves at import are macosx_10_14 (cp310-cp313) and macosx_10_15
          # (cp314+). Advertising 10.13 would promise platforms where the backend
          # cannot be installed.
          MACOSX_DEPLOYMENT_TARGET: "10.15"
          # Split mode: one cp310-abi3 wheel per platform covers Python 3.10+.
          # win_arm64 is the exception -- nanobind-backend publishes no cp310
          # wheel for it, so that platform is built from cp311 (the resulting
          # wheel is still tagged cp310-abi3 and installs on 3.11+).
          CIBW_BUILD: "cp310-* cp311-win_arm64"
          # No musllinux: there are no musllinux backend wheels, because
          # auditwheel bundles a private libstdc++ and split mode needs the C++
          # runtime shared for exceptions to propagate. Alpine installs from sdist,
          # where CMake falls back to a linked build.
          CIBW_SKIP: "*-musllinux_*"

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    if: github.repository_owner == 'michalsta'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check version
        run: python .github/scripts/check_version.py

      - name: Build sdist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  # Free-threaded CPython before 3.15 predates nanobind-backend's abi3t wheels,
  # so it gets no wheel from cibuildwheel and no backend requirement from
  # _pylmcf_metadata.py -- it must build from the sdist in linked mode with
  # nothing but numpy. This job is the guard on that: declaring the backend
  # statically used to make the resolve fail here before a compiler was reached,
  # and nothing else in CI installs on a free-threaded interpreter.
  test_sdist_freethreaded:
    name: Build from sdist on free-threaded CPython
    if: github.repository_owner == 'michalsta'
    needs: [build_sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v5
        with:
          name: cibw-sdist
          path: dist

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14t"

      - name: Install from sdist (compiles the extension in linked mode)
        run: |
          python -VV
          python -m pip install --upgrade pip
          python -m pip install -v dist/*.tar.gz

      - name: Assert the backend was not required
        # A linked build embeds nanobind; pulling nanobind-backend in here would
        # mean _pylmcf_metadata.py had mis-detected the interpreter.
        run: |
          python -c "import importlib.metadata as m; d = m.metadata('pylmcf').get_all('Requires-Dist'); print(d); assert not any('nanobind-backend' in r for r in d), d"
          python -c "import importlib.util as u; assert u.find_spec('nanobind_backend') is None, 'backend unexpectedly installed'"

      - name: Smoke-test the compiled extension
        run: |
          cd "$(mktemp -d)"
          python -c "import pylmcf; from pylmcf.pylmcf_cpp import CGraph; print('pylmcf OK', CGraph)"

      - name: Run the test suite
        run: |
          python -m pip install pytest
          python -m pytest tests/ -q

  # Split mode is CPython-only, so PyPy gets no wheel. It must still be able to
  # build pylmcf from the sdist, which is the only path that exercises the
  # NB_STATIC fallback in CMakeLists.txt. Without this job that fallback would
  # rot unnoticed until somebody on PyPy or Alpine tried to install.
  test_sdist_pypy:
    name: Build from sdist on PyPy
    if: github.repository_owner == 'michalsta'
    needs: [build_sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v5
        with:
          name: cibw-sdist
          path: dist

      - uses: actions/setup-python@v5
        with:
          python-version: "pypy3.11"

      - name: Install from sdist (compiles the extension in linked mode)
        run: |
          python -VV
          python -m pip install --upgrade pip
          python -m pip install -v dist/*.tar.gz

      - name: Smoke-test the compiled extension
        # Run from a scratch directory so the import resolves to the installed
        # package rather than the source tree next to it.
        run: |
          cd "$(mktemp -d)"
          python -c "import pylmcf; from pylmcf.pylmcf_cpp import CGraph; print('pylmcf OK', CGraph)"

      - name: Run the test suite
        run: |
          python -m pip install pytest
          python -m pytest tests/ -q
