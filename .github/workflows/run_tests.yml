name: Build

on:
    push:
        branches:
            - ci_test
            - testing
            - main
    # Nightly tier-B run, staggered across the four repositories so they do not
    # all land on wloczykij's runners at once. Delete these two lines to drop it.
    schedule:
        - cron: "0 1 * * *"
    # Run any tier by hand, without having to tag something to get the wide one.
    workflow_dispatch:
        inputs:
            tier:
                description: "CI tier: auto, A (fast), B (covering), C (full)"
                type: choice
                default: auto
                options: [auto, A, B, C]
    # Called by publish.yml on a v* tag. github.ref is refs/tags/v* there, which
    # selects RELEASE_TIER -- see .github/scripts/ci_matrix.py.
    workflow_call:

concurrency:
  # Superseded runs on a branch get cancelled; a release run never does. Before
  # this, cancelling by hand was the routine -- nine of the last twelve runs on
  # this repo ended `cancelled`.
  group: run-tests-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # Never read or write pip's HTTP/wheel cache: on the self-hosted runners
  # $HOME is a persistent bind mount, so caching leaks state across jobs/repos.
  PIP_NO_CACHE_DIR: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  # Which combinations run is decided in one place, in Python, where the
  # coverage argument is a readable table and is asserted rather than implied.
  # This job replaced a 6 x 6 x 2 cross-product with two dozen `exclude:` rules
  # duplicated across two near-identical jobs.
  select:
    name: Select CI tier
    if: github.repository_owner == 'michalsta'
    runs-on: ubuntu-latest
    outputs:
      tier: ${{ steps.pick.outputs.tier }}
      tests: ${{ steps.pick.outputs.tests }}
      sanitize: ${{ steps.pick.outputs.sanitize }}
    steps:
      - uses: actions/checkout@v5
      - id: pick
        env:
          # Empty (or "auto") for every trigger but workflow_dispatch.
          CI_TIER: ${{ github.event.inputs.tier }}
        run: python3 .github/scripts/ci_matrix.py

  run_pytest:
    name: ${{ matrix.lane }}
    needs: select
    runs-on: ${{ matrix.runner }}
    # Empty string means "run directly on the runner"; the hosted legs have
    # always relied on that, they just used to say it by omitting the key.
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.select.outputs.tests) }}

    steps:
      - uses: actions/checkout@v5
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          # 3.15 has no GA release yet; without this it cannot be resolved. The
          # flag only matters while a version is prerelease -- for every other
          # entry a GA release exists and still wins.
          allow-prereleases: true
      - name: Create isolated venv (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          # Ephemeral, per-job venv. Inside the self-hosted container it lives in
          # the throwaway container layer (/opt); on hosted runners in RUNNER_TEMP.
          # Never on the shared /__t toolcache, so a contaminated base interpreter
          # (e.g. a same-version build left behind by another job/repo) can't leak in.
          if [ -f /.dockerenv ]; then VENV=/opt/ci-venv; else VENV="$RUNNER_TEMP/ci-venv"; fi
          rm -rf "$VENV"
          python -m venv "$VENV"
          echo "$VENV/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$VENV" >> "$GITHUB_ENV"
      - name: Create isolated venv (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $venv = Join-Path $env:RUNNER_TEMP 'ci-venv'
          if (Test-Path $venv) { Remove-Item -Recurse -Force $venv }
          python -m venv $venv
          Add-Content -Path $env:GITHUB_PATH -Value "$venv\Scripts"
          Add-Content -Path $env:GITHUB_ENV -Value "VIRTUAL_ENV=$venv"
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: "Non-default compiler: set up Clang"
        if: matrix.compiler == 'clang'
        run: |
          echo "CC=clang" >> $GITHUB_ENV
          echo "CXX=clang++" >> $GITHUB_ENV
          echo "CMAKE_ARGS=-DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++" >> $GITHUB_ENV
      - name: Install package
        env:
          VERBOSE: '1'
        run: |
          python -m pip install -v .[pytest]
      - name: Test with pytest
        working-directory: ./tests
        run: |
          python -m pytest .

  # The tests_cpp/ oracle suites: the only tests of the header-only solvers
  # (LCT simplex, chain solver, LEMON warm restarts, canonical potentials).
  # Standalone executables, no Python, so this is neither part of the
  # ci_matrix.py covering array (whose sanitizer lanes build and import the
  # extension) nor of any tier: ~2-4 min per lane, so all lanes always run.
  # Every lane dry-ran clean in this exact image before being added.
  tests_cpp:
    name: "[tests_cpp] ${{ matrix.label }}"
    needs: select
    runs-on: [self-hosted, wloczykij-amd64]
    container: localhost:5000/ubuntu-ci:24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: gcc asan+ubsan
            cxx: g++
            # _GLIBCXX_ASSERTIONS is libstdc++'s hardened mode (bounds-checked
            # operator[], front/back on empty, ...); _GLIBCXX_SANITIZE_VECTOR
            # lets ASan see past-size() accesses within a vector's capacity.
            # pointer-compare/pointer-subtract are deliberately absent: they
            # flag libstdc++'s own vector::capacity() (end_of_storage - start).
            cxxflags: >-
              -O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined
              -fno-sanitize-recover=all -D_GLIBCXX_ASSERTIONS -D_GLIBCXX_SANITIZE_VECTOR
            ldflags: ""
          - label: gcc debug mode + hardening
            cxx: g++
            # _GLIBCXX_DEBUG: full checked-iterator mode (iterator invalidation,
            # comparator strict-weak-ordering, sortedness preconditions); not
            # combined with ASan, whose allocator hooks it conflicts with. The
            # rest is distro-style hardening at -O2, which _FORTIFY_SOURCE needs.
            # Uninitialised locals become a pattern, and freed/allocated heap
            # memory is perturbed (GLIBC_TUNABLES below), so a read of either
            # turns into a wrong answer the oracles catch rather than a lucky 0.
            cxxflags: >-
              -O2 -g -D_GLIBCXX_DEBUG -D_GLIBCXX_DEBUG_PEDANTIC -D_GLIBCXX_ASSERTIONS
              -D_FORTIFY_SOURCE=3 -fstack-protector-strong -fstack-clash-protection
              -fcf-protection=full -ftrivial-auto-var-init=pattern
            ldflags: ""
            glibc_tunables: glibc.malloc.perturb=165
          - label: clang asan+ubsan strict
            cxx: clang++
            # Beyond -fsanitize=undefined: unsigned wraparound and implicit
            # narrowing / sign-changing conversions (e.g. an int64 count
            # truncated into LEMON's int node index), float division by zero,
            # and local array bounds. Those are not UB in themselves, so system
            # headers are excluded (libstdc++'s RNG wraps on purpose); our
            # headers and the vendored LEMON stay checked.
            cxxflags: >-
              -O1 -g -fno-omit-frame-pointer
              -fsanitize=address,undefined,integer,implicit-conversion,float-divide-by-zero,local-bounds,nullability
              -fsanitize-ignorelist=tests_cpp/ubsan-system-headers.ignorelist
              -fno-sanitize-recover=all -D_GLIBCXX_ASSERTIONS
            ldflags: ""
          - label: clang libc++ hardened+asan+ubsan
            cxx: clang++-22
            libcxx: true
            # LLVM from apt.llvm.org, not Ubuntu's clang 18: Ubuntu links its
            # libc++/libc++abi with -Bsymbolic-functions, which defeats ASan's
            # interposition inside them (LLVM #59432) and reports a bogus
            # alloc-dealloc-mismatch on every thrown exception. wnet's libc++
            # sanitizer lane uses the same LLVM for the same reason.
            llvm_apt: "22"
            # libc++'s strictest hardening mode, the counterpart of
            # _GLIBCXX_ASSERTIONS/_GLIBCXX_DEBUG on the other standard library.
            cxxflags: >-
              -O1 -g -fno-omit-frame-pointer -stdlib=libc++
              -D_LIBCPP_HARDENING_MODE=_LIBCPP_HARDENING_MODE_DEBUG
              -fsanitize=address,undefined -fno-sanitize-recover=all
            ldflags: -stdlib=libc++
          - label: clang msan
            cxx: clang++
            # Uninitialised reads, which ASan does not see: the warm-repair
            # scratch buffers and lazily built indices are the target. The
            # suites use only header-instantiated std code (vector, algorithm)
            # plus printf, so the uninstrumented libstdc++ is not a source of
            # false positives here.
            cxxflags: >-
              -O1 -g -fno-omit-frame-pointer -fsanitize=memory
              -fsanitize-memory-track-origins=2 -fsanitize-memory-use-after-dtor
              -fno-sanitize-recover=all
            ldflags: ""

    steps:
      - uses: actions/checkout@v5
      - name: Add apt.llvm.org
        if: matrix.llvm_apt
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-${{ matrix.llvm_apt }} main" \
            | sudo tee /etc/apt/sources.list.d/llvm-${{ matrix.llvm_apt }}.list
      - name: Install the clang sanitizer runtime, symbolizer (and libc++)
        if: startsWith(matrix.cxx, 'clang')
        run: |
          if [ -n "${{ matrix.llvm_apt }}" ]; then
            V="${{ matrix.llvm_apt }}"
            PKGS="clang-$V"
          else
            V=$(clang --version | grep -oP '(?<=clang version )\d+')
            PKGS=""
          fi
          # llvm-$V carries llvm-symbolizer: without it clang's sanitizer
          # runtimes print bare addresses (gcc's symbolize on their own).
          PKGS="$PKGS libclang-rt-$V-dev llvm-$V"
          if [ "${{ matrix.libcxx }}" = "true" ]; then
            PKGS="$PKGS libc++-$V-dev libc++abi-$V-dev"
          fi
          sudo apt-get update -q && sudo apt-get install -y $PKGS
          for s in ASAN MSAN UBSAN; do
            echo "${s}_SYMBOLIZER_PATH=/usr/lib/llvm-$V/bin/llvm-symbolizer" >> "$GITHUB_ENV"
          done
      - name: Build and run every tests_cpp suite
        env:
          CXX: ${{ matrix.cxx }}
          CXXFLAGS: ${{ matrix.cxxflags }}
          LDFLAGS: ${{ matrix.ldflags }}
          # Leak checking stays on: unlike the Python-extension sanitizer
          # lanes in wnet, these are plain executables.
          ASAN_OPTIONS: >-
            detect_leaks=1:strict_string_checks=1:detect_stack_use_after_return=1:check_initialization_order=1:strict_init_order=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          MSAN_OPTIONS: halt_on_error=1
          GLIBC_TUNABLES: ${{ matrix.glibc_tunables }}
        run: tests_cpp/run_all.sh
