[build-system]
# scikit-build-core>=1.0: the [[tool.dynamic-metadata]] table below is the 0.3
# spec, which older backends do not read. They would not fail -- they would
# ignore it, leaving `dynamic = ["dependencies"]` unresolved and shipping a
# wheel that declares no dependencies at all.
requires = ["scikit-build-core>=1.0", "nanobind>=3.0.1"]
build-backend = "_pylmcf_build"
backend-path = ["."]

[project]
name = "pylmcf"
version = "1.3.0"
description = "Min-cost-flow solvers for Python and C++: LEMON with warm restarts, plus link-cut-tree network simplex variants"
authors = [{ name="Michał Startek", email="michal.startek@mimuw.edu.pl" }]
maintainers = [{ name="Michał Startek", email="michal.startek@mimuw.edu.pl" }]
license = "BSL-1.0"
license-files = ["LICENCE"]
# Resolved per-build by _pylmcf_metadata.py: nanobind-backend is required only
# by a split-mode build, and no PEP 508 marker can see which mode CMake picked.
dynamic = ["dependencies"]
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Development Status :: 5 - Production/Stable",
]
keywords = ["network simplex", "minimum cost flow", "lemon", "graph algorithms", "link-cut tree", "warm start", "optimal transport"]
requires-python = ">=3.10"

[project.urls]
"Homepage" = "https://github.com/michalsta/pylmcf"
"Repository" = "https://github.com/michalsta/pylmcf.git"

[project.optional-dependencies]
extras = ["networkx", "matplotlib"]
pytest = ["pytest", "networkx"]

[tool.scikit-build]
# _pylmcf_build selects wheel.py-api before every wheel/editable hook:
# cp310 for split mode, cp315t for free-threaded split mode, empty for linked.
minimum-version = "build-system.requires"

[tool.scikit-build.sdist]
exclude = [
    "experiments/**",
    "tests/**",
    "tests_build/**",
    "workshop/**",
    "wheelhouse/**",
    "**/__pycache__/**",
    "*.prof",
    "reinstall.sh",
    ".github/**",
    ".vscode/**",
    "CLAUDE.md",
    "AGENTS.md",
    "bugfixes-handoff.md",
]

# The standard top-level dynamic-metadata table (0.3 spec). The previous
# [tool.scikit-build.metadata.dependencies] form was deprecated in
# scikit-build-core 1.0 and warns on every build; the two cannot be combined.
# The inline {path, module} value is how a local, in-project provider is named --
# a bare import string here would be looked up in the dynamic_metadata.provider
# entry-point group instead, and not found. _pylmcf_metadata.py is kept in the
# sdist for exactly this reason.
[[tool.dynamic-metadata]]
provider = { path = ".", module = "_pylmcf_metadata" }
